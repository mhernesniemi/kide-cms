name: Release

# Publishes @kidecms/core to npm when a v* tag is pushed. The tag version must
# match src/cms/package.json (and the root template version). Publishes through
# npm Trusted Publishing (OIDC): @kidecms/core trusts this repo's release.yml, so
# no npm token is stored.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release creation
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # verify-upgrade.mjs needs the previous v* tag reachable from HEAD
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile

      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./src/cms/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match src/cms/package.json version $PKG" >&2
            exit 1
          fi

      # Full gate — a tag push does not trigger the branch CI workflow, so the
      # release must run everything itself before publishing.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:workers
      - run: pnpm verify:pack
      - run: pnpm verify:package
      - run: pnpm verify:cloudflare
      - run: pnpm verify:starters
      - run: node scripts/verify-upgrade.mjs

      # npm itself, not pnpm, so the OIDC exchange runs (src/cms has no workspace: deps).
      - name: Publish @kidecms/core
        working-directory: src/cms
        run: npm publish --provenance

      # Notes come from the tag's CHANGELOG section; the title stays the bare
      # tag — edit on github.com to append a descriptive suffix if wanted.
      - name: Create GitHub Release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '$0 ~ "^## \\[" ver "\\]" {flag=1;next} /^## \[/ {flag=0} flag' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION — creating release with generated notes" >&2
            gh release create "$GITHUB_REF_NAME" --generate-notes --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
