name: Release

# Publishes @kidecms/core to npm when a v* tag is pushed. The tag version must
# match src/cms/package.json (and the root template version). Requires the
# NPM_TOKEN repository secret (npm automation token with publish rights to the
# @kidecms scope).

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Release creation
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./src/cms/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match src/cms/package.json version $PKG" >&2
            exit 1
          fi

      # Full gate — a tag push does not trigger the branch CI workflow, so the
      # release must run everything itself before publishing.
      - run: pnpm check
      - run: pnpm test
      - run: pnpm test:workers
      - run: pnpm verify:pack
      - run: pnpm verify:package
      - run: pnpm verify:cloudflare
      - run: pnpm verify:starters

      - name: Publish @kidecms/core
        run: pnpm --filter @kidecms/core publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Notes come from the tag's CHANGELOG section; the title stays the bare
      # tag — edit on github.com to append a descriptive suffix if wanted.
      - name: Create GitHub Release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '$0 ~ "^## \\[" ver "\\]" {flag=1;next} /^## \[/ {flag=0} flag' CHANGELOG.md > /tmp/release-notes.md
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No CHANGELOG section for $VERSION — creating release with generated notes" >&2
            gh release create "$GITHUB_REF_NAME" --generate-notes --latest
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
