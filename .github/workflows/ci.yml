name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-test:
    name: Check + test (embedded mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @kidecms/wordpress check
      - run: pnpm --filter @kidecms/wordpress test
      - run: pnpm test
      - run: pnpm test:workers

  verify-pack:
    name: Publish manifest is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:pack

  verify-package-mode:
    name: Package mode builds + serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:package

  verify-cloudflare:
    name: Cloudflare target builds + serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:cloudflare

  verify-starters:
    name: Starters assemble, seed, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:starters

  verify-upgrade:
    name: Previous release upgrades to HEAD
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the script needs every v* tag reachable from HEAD
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-upgrade.mjs

  verify-sveltekit:
    name: SvelteKit target builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-sveltekit.mjs
      - run: node scripts/verify-sveltekit.mjs --starter=marketing
      - run: node scripts/verify-sveltekit.mjs --mode=package --starter=marketing
      - run: node scripts/verify-sveltekit.mjs --target=cloudflare --starter=marketing

  verify-scaffold:
    name: Fresh scaffolds start and serve
    # Scaffolds from the pushed branch, which a pull request's merge ref is not.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: git clone --depth 1 https://github.com/mhernesniemi/create-kide-app.git "$RUNNER_TEMP/create-kide-app"
      - run: pnpm install --no-frozen-lockfile
        working-directory: ${{ runner.temp }}/create-kide-app
      - run: node scripts/verify-scaffold.mjs
        env:
          KIDE_SCAFFOLDER: ${{ runner.temp }}/create-kide-app/index.js
